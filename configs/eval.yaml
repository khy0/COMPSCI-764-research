# Shared evaluation configuration, consumed by src/evaluate.py for BOTH arms.
# One config, one implementation — do not fork per-arm (planning doc, §2).

metrics:
  - dice
  - iou
  - boundary_iou
  - hd95
  - precision
  - recall

boundary_iou:
  # Resolved PER IMAGE as dilation_ratio * that image's own diagonal (min 1px),
  # not one fixed pixel count — Kvasir-SEG images range from 332x487 to
  # 1920x1072 (diagonal varies ~3.7x), so a single fixed width would be a
  # razor-thin band on small images and far too strict on large ones. 0.02 is
  # the default from the original paper (Cheng et al., CVPR 2021) and its
  # official implementation, not a value this project invented — works out to
  # 12px at the smallest Kvasir-SEG image and 44px at the largest. Decided and
  # closed 2026-09-30, see decisions.md.
  dilation_ratio: 0.02
  # Manual override: set this to a fixed integer instead to force the same
  # pixel width on every image regardless of its resolution (debug/one-off use
  # only — this is not how the real evaluation pass should be run). Leave null
  # for the normal, per-image ratio-based behaviour above.
  dilation_px: null

hd95:
  percentile: 95

statistics:
  bootstrap_resamples: 10000
  ci: 0.95
  paired_test: wilcoxon           # paired over test images — same images score both arms
  multiple_comparisons: null      # TODO: "bonferroni" or "exploratory" — decide Week 4

stratification:
  polyp_size_pct:                 # mask area as % of image
    small: [0, 5]
    medium: [5, 15]
    large: [15, 100]
  boundary_contrast: mean_gradient_in_contour_band   # cheap proxy, see planning doc §3.3

compute_profiling:
  track_latency: true
  track_memory: true
  track_params: true
  same_hardware_required: true    # both arms MUST be profiled on the same machine

output:
  per_image_csv: results/per_image_results.csv   # single source of truth — all
                                                    # aggregate stats derive from this
